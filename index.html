    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1E0C08; }
      #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #1E0C08; outline: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; text-align: center; color: #F2D98A; font-family: Georgia, "Times New Roman", serif; }
      #unity-loading-title { font-size: 42px; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.7); }
      #unity-loading-sub { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.75; margin-bottom: 26px; }
      #unity-progress-bar-empty { width: 260px; height: 10px; margin: 0 auto; border: 1px solid #C9A24A; border-radius: 6px; background: rgba(0,0,0,0.45); overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: linear-gradient(90deg, #B8892E, #F7E7A8, #B8892E); border-radius: 6px; transition: width 120ms linear; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px; border-radius: 6px; display: none; font-family: sans-serif; }
    </style>
    <script>
      // HTML5 portal ads. The portal is picked from the host name or "?portal=" for testing:
      //   crazygames        -> CrazyGames SDK v3
      //   gamedistribution  -> GameDistribution SDK (needs &gameid=<GUID>)
      // On our own hosting no SDK loads, "ready" stays false and the game runs without ads.
      window.makaalaPortal = (function () {
        var q = new URLSearchParams(location.search);
        var host = location.hostname || '';
        var kind = q.get('portal') ||
          (/crazygames/i.test(host) ? 'crazygames' :
          (/gamedistribution|gamemonetize|gamepix/i.test(host) ? 'gamedistribution' : ''));
        var api = { ready: false, kind: kind || 'none', pending: null };

        function send(method, arg) {
          try { if (window.makaalaUnity) window.makaalaUnity.SendMessage('MakaalaPortalAds', method, arg || ''); }
          catch (e) { console.warn('[portal] callback failed', e); }
        }
        function finishInterstitial() { if (api.pending === 'interstitial') { api.pending = null; send('OnInterstitialDone'); } }
        function finishRewarded(earned) { if (api.pending === 'rewarded') { api.pending = null; send('OnRewardedDone', earned ? '1' : '0'); } }

        api.showInterstitial = function () { api.pending = 'interstitial'; api.request('midgame'); };
        api.showRewarded = function () { api.pending = 'rewarded'; api.request('rewarded'); };
        api.request = function () { finishInterstitial(); finishRewarded(false); };
        api.gameplay = function () {};
        api.happyTime = function () {};

        function loadScript(src, onload) {
          var s = document.createElement('script');
          s.src = src; s.async = true; s.onload = onload;
          s.onerror = function () { console.warn('[portal] SDK failed to load:', src); };
          document.head.appendChild(s);
        }

        if (kind === 'crazygames') {
          loadScript('https://sdk.crazygames.com/crazygames-sdk-v3.js', function () {
            var sdk = window.CrazyGames && window.CrazyGames.SDK;
            if (!sdk) return;
            sdk.init().then(function () {
              api.ready = true;
              api.request = function (type) {
                sdk.ad.requestAd(type === 'rewarded' ? 'rewarded' : 'midgame', {
                  adFinished: function () { finishInterstitial(); finishRewarded(true); },
                  adError: function () { finishInterstitial(); finishRewarded(false); }
                });
              };
              api.gameplay = function (playing) { try { playing ? sdk.game.gameplayStart() : sdk.game.gameplayStop(); } catch (e) {} };
              api.happyTime = function () { try { sdk.game.happytime(); } catch (e) {} };
              console.log('[portal] CrazyGames SDK ready');
            }).catch(function (e) { console.warn('[portal] CrazyGames init failed', e); });
          });
        } else if (kind === 'gamedistribution') {
          window.GD_OPTIONS = {
            gameId: q.get('gameid') || '00000000000000000000000000000000',
            onEvent: function (event) {
              switch (event.name) {
                case 'SDK_GAME_START': finishInterstitial(); finishRewarded(api.rewardGranted === true); api.rewardGranted = false; break;
                case 'SDK_REWARDED_WATCH_COMPLETE': api.rewardGranted = true; break;
                case 'SDK_READY': api.ready = true; console.log('[portal] GameDistribution SDK ready'); break;
                case 'SDK_ERROR': finishInterstitial(); finishRewarded(false); break;
              }
            }
          };
          loadScript('https://html5.api.gamedistribution.com/main.min.js', function () {
            api.request = function (type) {
              try {
                if (type === 'rewarded' && window.gdsdk && window.gdsdk.preloadAd) {
                  window.gdsdk.preloadAd('rewarded').then(function () { window.gdsdk.showAd('rewarded'); })
                    .catch(function () { finishRewarded(false); });
                } else if (window.gdsdk) {
                  window.gdsdk.showAd();
                } else { finishInterstitial(); finishRewarded(false); }
              } catch (e) { finishInterstitial(); finishRewarded(false); }
            };
            api.gameplay = function (playing) {
              try { if (window.gdsdk) playing ? window.gdsdk.preloadAd('interstitial') : null; } catch (e) {}
            };
          });
        }
        return api;
      })();
    </script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">Makaala</div>
        <div id="unity-loading-sub">Mancala &amp; Kalah</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #7a1f1f; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #6b5a12; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Makaala Games",
        productName: "Makaala",
        productVersion: "1.2.3",
        showBanner: unityShowBanner,
      };

      // The canvas always fills the browser window (desktop and mobile); Unity keeps the
      // render target matched to the canvas DOM size, so resizing the window just works.
      // Cap the device pixel ratio on very dense screens to keep the frame rate up.
      if (window.devicePixelRatio > 2) config.devicePixelRatio = 2;

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.makaalaUnity = unityInstance;
          // Double-tap / F11-style: F key toggles browser fullscreen for the game.
          window.addEventListener("keydown", (e) => {
            if (e.key === "F11" || (e.key.toLowerCase() === "f" && e.ctrlKey)) { e.preventDefault(); unityInstance.SetFullscreen(1); }
          });
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
