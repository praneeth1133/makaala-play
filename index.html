<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Makaala</title>
    <meta name="description" content="Makaala is 3D Mancala (Kalah) on a handcrafted mahogany board. Play the AI, pass and play, daily puzzles, or online with a friend. Free in your browser.">
    <meta name="theme-color" content="#1E0C08">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Makaala">
    <link rel="apple-touch-icon" href="og-image.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Makaala: Mancala & Kalah">
    <meta property="og:description" content="3D Mancala on a handcrafted mahogany board. Play the AI, pass and play, daily puzzles, or online with a friend.">
    <meta property="og:image" content="og-image.png">
    <meta property="og:url" content="https://makaala-web.vercel.app/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Makaala: Mancala & Kalah">
    <meta name="twitter:description" content="3D Mancala on a handcrafted mahogany board. Free in your browser.">
    <meta name="twitter:image" content="og-image.png">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1E0C08; }
      #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #1E0C08; outline: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; text-align: center; color: #F2D98A; font-family: Georgia, "Times New Roman", serif; }
      #unity-loading-title { font-size: 42px; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.7); }
      #unity-loading-sub { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.75; margin-bottom: 26px; }
      #unity-progress-bar-empty { width: 260px; height: 10px; margin: 0 auto; border: 1px solid #C9A24A; border-radius: 6px; background: rgba(0,0,0,0.45); overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: linear-gradient(90deg, #B8892E, #F7E7A8, #B8892E); border-radius: 6px; transition: width 120ms linear; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px; border-radius: 6px; display: none; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">Makaala</div>
        <div id="unity-loading-sub">Mancala &amp; Kalah</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #7a1f1f; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #6b5a12; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Makaala Games",
        productName: "Makaala",
        productVersion: "1.2.2",
        showBanner: unityShowBanner,
      };

      // The canvas always fills the browser window (desktop and mobile); Unity keeps the
      // render target matched to the canvas DOM size, so resizing the window just works.
      // Cap the device pixel ratio on very dense screens to keep the frame rate up.
      if (window.devicePixelRatio > 2) config.devicePixelRatio = 2;

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.makaalaUnity = unityInstance;
          // Double-tap / F11-style: F key toggles browser fullscreen for the game.
          window.addEventListener("keydown", (e) => {
            if (e.key === "F11" || (e.key.toLowerCase() === "f" && e.ctrlKey)) { e.preventDefault(); unityInstance.SetFullscreen(1); }
          });
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
